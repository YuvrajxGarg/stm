# Unit tests on every platform, plus the real model checked against PyTorch.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install onnx -r requirements.txt
      - run: python -m unittest discover tests -v

  model:
    uses: ./.github/workflows/model.yml
